<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="head">
      <div id="techpathshala-logo">
        <img src="asset\techpathshala_logo.svg" alt="techpathshala_logo" />
      </div>
      <div id="profile-info">
        <p id="profile-name">sudh</p>
        <img
          src="asset\profile logo.jpg"
          alt="profile-image"
          height="35px"
          width="35px"
        />
      </div>
    </header>
    <section>
      <div id="question-counter">
        <h2>Question <span id="count">1</span> of 10</h2>
      </div>
      <div id="date"></div>

      <div id="timer">
        <sub
          ><img src="asset\timeroutline.png" height="30px" width="30px" />
          </sub>00:00
      </div>
      <div id="progress-bar">
        <div id="progress">
          <!-- progress -->
        </div>
        <!-- progress-bar -->
      </div>
      <div id="question-wrapper">
        <h3 id="asked-question">question to be asked</h3>
        <ol>
          <li>
            <input type="radio" id="option1" name="option" />
            <label class="Options" for="option1" onclick="choosedAnswer(1)"
              >1.<span id="opt1">option</span></label
            >
          </li>
          <li>
            <input type="radio" id="option2" name="option" />
            <label class="Options" for="option2" onclick="choosedAnswer(2)"
              >2.<span id="opt2">option</span></label
            >
          </li>
          <li>
            <input type="radio" id="option3" name="option" />
            <label class="Options" for="option3" onclick="choosedAnswer(3)"
              >3.<span id="opt3">option</span></label
            >
          </li>
          <li>
            <input type="radio" id="option4" name="option" />
            <label class="Options" for="option4" onclick="choosedAnswer(4)"
              >4.<span id="opt4">option</span></label
            >
          </li>
        </ol>
      </div>
      <div id="button-wrapper">
        <button id="previous" onclick="previous()">previous</button>
        <button id="next" onclick="next()">next</button>
      </div>
    </section>
    <script src="main.js"></script>
    <script>
      startQuize();
      displayQuestion();
    </script>
  </body>
</html>
